name: Build Wildlife APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Entpacken
        run: unzip WildlifeDeutschland_Revolut_Style_Android.zip

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        working-directory: WildlifeDeutschland_Android
        run: gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Wildlife-Deutschland-APK
          path: WildlifeDeutschland_Android/app/build/outputs/apk/debug/app-debug.apk
